<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kenal Lebih</title>
  <!-- A-Frame 1.4.2 & MindAR 1.2.5 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    #debug-box {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.8);
      color: #00ff88;
      font-family: monospace;
      font-size: 12px;
      padding: 10px;
      border-radius: 8px;
      pointer-events: none;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Kotak status sementara untuk cek kondisi AR di HP -->
  <div id="debug-box">Status: Menyiapkan mesin AR...</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Preload Aset 2D -->
    <a-assets timeout="5000">
      <img id="img-ig" src="./IG1.jpg" />
      <img id="img-linkedin" src="./LinkedIn.webp" />
    </a-assets>

    <!-- Kamera dengan Raycaster -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="fuse: false; rayOrigin: mouse;"
      raycaster="far: 10000; objects: .clickable">
    </a-camera>

    <!-- Konten AR -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Tombol Instagram -->
      <a-image
        id="btn-ig"
        class="clickable"
        src="#img-ig"
